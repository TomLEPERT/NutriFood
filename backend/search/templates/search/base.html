{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}NutriFood{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'search/css/style.css' %}">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'search:index' %}">
        <span class="brand-dot"></span>
        <span>NutriFood</span>
      </a>

      <nav class="nav">
        <a href="{% url 'search:index' %}">Recherche</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {% now "Y" %} NutriFood</span>
      <span class="muted">Manger mieux, simplement.</span>
    </div>
  </footer>
</body>
</html>
